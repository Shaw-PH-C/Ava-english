<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava 英文能力升級計畫 - 第二週 Day 2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 20px;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 15px;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8f4f8;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .nav-bar select {
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #b0c4de;
            background: #fff;
            cursor: pointer;
        }
        .streak-badge {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .reward-box {
            background: #eafaf1;
            border: 1px solid #a3e4d7;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .reward-title {
            font-size: 14px;
            font-weight: bold;
            color: #117a65;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .progress-bar-container {
            width: 100%;
            background: #d1f2eb;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #27ae60;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }
        .reward-desc {
            font-size: 12px;
            color: #16a085;
            margin-top: 6px;
            text-align: right;
        }
        .section-title {
            font-size: 16px;
            color: #2980b9;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
        }
        ul {
            padding-left: 20px;
            margin: 5px 0;
        }
        li {
            margin-bottom: 8px;
            font-size: 15px;
        }
        .audio-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
            transition: background 0.2s;
        }
        .audio-btn:hover {
            background-color: #2980b9;
        }
        .formula-box {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 12px;
            border-radius: 4px;
            font-size: 15px;
            margin: 15px 0;
        }
        .quiz-box {
            background: #fdfefe;
            border: 1px solid #d5dbdb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .question {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            color: #34495e;
        }
        .options label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            cursor: pointer;
        }
        .task-box {
            background: #fff9e6;
            border: 1px dashed #f1c40f;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            margin-top: 8px;
            resize: none;
        }
        button.submit-btn {
            width: 100%;
            background-color: #06c755;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button.submit-btn:hover {
            background-color: #05b34c;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #ffffff;
            width: 85%;
            max-width: 350px;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popUp 0.3s ease-in-out;
        }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-card h2 {
            color: #27ae60;
            margin-top: 0;
            font-size: 22px;
        }
        .modal-card p {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
            margin: 15px 0;
        }
        .modal-btn {
            background-color: #06c755;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Ava 英文能力升級計畫</h1>
    <div class="subtitle">第二週：機場通關與航廈應變</div>

    <div class="nav-bar">
        <span style="font-size: 14px; font-weight: bold; color: #2c3e50;">📅 選擇練習天數：</span>
        <select id="daySelector" onchange="switchDay(this.value)">
            <option value="w2_1">第二週 Day 1：海關入境目的</option>
            <option value="w2_2" selected>第二週 Day 2：行李與海關申報 (進階)</option>
            <option value="w1_weekend">⬅️ 回顧：第一週週末總複習</option>
        </select>
    </div>

    <div class="streak-badge" id="streakDisplay">🔥 目前連續打卡計算中...</div>

    <div class="reward-box">
        <div class="reward-title">
            <span>🎁 實體心願解鎖：精美衣服一件</span>
            <span id="progressText">0 / 5 天</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="reward-desc" id="rewardDesc">連續打卡滿 5 天即可解鎖心願禮物！</div>
    </div>

    <div id="contentArea"></div>
</div>

<div class="modal-overlay" id="successModal">
    <div class="modal-card">
        <h2>🎉 太棒了！打卡成功！</h2>
        <p id="modalText">你已經完成今日挑戰！英文能力正在飛速進步中，繼續保持！🚀</p>
        <button class="modal-btn" onclick="proceedToLine()">🚀 馬上傳送到 Line 驗收</button>
    </div>
</div>

<script>
    const daysData = {
        w2_1: {
            title: "第二週 Day 1：海關入境目的 (Customs & Purpose)",
            words: [
                { en: "Customs", zh: "海關" },
                { en: "Purpose", zh: "目的 / 用途" },
                { en: "Vacation", zh: "假期 / 度假" },
                { en: "Business", zh: "商務 / 出差" },
                { en: "Stay", zh: "停留 / 待" }
            ],
            formula: '"I am here for vacation. I will stay for five days."',
            formulaZh: "(我是來度假的。我會停留五天。)",
            quizzes: [
                { q: "1. 飛機降落後要通關的「海關」英文是？", opts: ["Customs", "Kitchen", "Hotel"], ans: 0 },
                { q: "2. 當海關問你旅行的「目的 (Purpose)」，如果你是來出差，要回答？", opts: ["Vacation", "Business", "Shopping"], ans: 1 },
                { q: "3. 「I am here for...」在海關問話中最常用的意思是？", opts: ["我來這裡為了...", "我住在這裡...", "我討厭這裡..."], ans: 0 },
                { q: "4. 如果想表達「停留五天」，英文怎麼說？", opts: ["Go for five days", "Stay for five days", "Run for five days"], ans: 1 },
                { q: "5. 「Vacation」這個單字的意思是？", opts: ["商務開會", "度假 / 假期", "轉機"], ans: 1 }
            ],
            placeholder: "例如：\nI am here for vacation. I will stay for five days."
        },
        w2_2: {
            title: "第二週 Day 2：行李與海關申報 (Baggage & Declaration - 10單字挑戰)",
            words: [
                { en: "Luggage", zh: "行李" },
                { en: "Baggage claim", zh: "行李提領處" },
                { en: "Declare", zh: "申報" },
                { en: "Nothing to declare", zh: "無須申報" },
                { en: "Prohibited", zh: "禁止的 / 違禁的" },
                { en: "Item", zh: "物品 / 項目" },
                { en: "Duty-free", zh: "免稅的" },
                { en: "Form", zh: "表格" },
                { en: "Security", zh: "安全檢查 / 安檢" },
                { en: "Check", zh: "檢查 / 核對" }
            ],
            formula: '"I have nothing to declare. These are just personal items."',
            formulaZh: "(我沒有需要申報的東西。這些就只是個人私人物品。)",
            quizzes: [
                { q: "1. 當海關詢問你是否有攜帶需要課稅的物品，若完全沒有違禁或超量，你要自信地回答：", opts: ["I have a lot to declare.", "I have nothing to declare.", "I want to check luggage."], ans: 1 },
                { q: "2. 在機場走到轉盤拿行李時，應該要尋找哪一個指示牌？", opts: ["Baggage claim", "Duty-free shop", "Security check"], ans: 0 },
                { q: "3. 「Prohibited」這個海關常見單字的正確中文意思是？", opts: ["特價優惠的", "免費贈送的", "禁止的 / 違禁的"], ans: 2 },
                { q: "4. 如果海關指著你的行李箱問這些是什麼，你說「These are just personal items」，意思是？", opts: ["這些只是我的個人私人物品。", "這些是公司要賣的商品。", "這些是禁止攜帶的物品。"], ans: 0 },
                { q: "5. 入境時通常需要在機上或海關填寫申報單，請問「表格」的英文單字是？", opts: ["Form", "Item", "Claim"], ans: 0 }
            ],
            placeholder: "例如：\nI have nothing to declare. These are just personal items."
        },
        w1_weekend: {
            title: "🎉 第一週週末總複習與總結挑戰",
            words: [
                { en: "Review", zh: "複習本週所有飯店情境" },
                { en: "Emergency", zh: "突發狀況應對" }
            ],
            formula: '"I am ready for my hotel trip!"',
            formulaZh: "(我已經準備好我的飯店英文之旅了！)",
            quizzes: [
                { q: "1. (Day 1) 房間冷氣壞掉時，要說：The [ ] in my room isn't working.", opts: ["Air conditioner", "Bed", "Window"], ans: 0 },
                { q: "2. (Day 2) 想換房間時，最禮貌的開頭是？", opts: ["Give me another room", "Could I please move to another room?", "Change room now"], ans: 1 },
                { q: "3. (Day 3) 被反鎖在房外時，英文片語是？", opts: ["Locked out", "Locked in", "Open door"], ans: 0 },
                { q: "4. (Day 4) 想詢問能否延遲退房，應該說：Is it possible to have a...?", opts: ["Early check-in", "Late checkout", "Fast service"], ans: 1 },
                { q: "5. (Day 5) 發現帳單有誤時，要說：I think there's a mistake on my...", opts: ["Bill", "Menu", "Key"], ans: 0 }
            ],
            placeholder: "請寫下一句這禮拜學到最有印象的飯店實用英文："
        }
    };

    let globalPendingLineUrl = "";

    function renderDay(dayKey) {
        const data = daysData[dayKey];
        let html = `<div style="font-weight: bold; color: #34495e; margin-bottom: 15px; font-size: 16px;">📌 ${data.title}</div>`;

        html += `<div class="section-title">📚 今日核心單字庫（點擊 🔊 聽發音）</div><ul>`;
        data.words.forEach(w => {
            html += `<li><b>${w.en}</b> (${w.zh}) <button class="audio-btn" onclick="speakText('${w.en}')">🔊 讀音</button></li>`;
        });
        html += `</ul>`;

        html += `<div class="section-title">🗣️ 今日黃金句型</div>`;
        html += `<div class="formula-box"><b>${data.formula}</b><button class="audio-btn" style="float: right;" onclick="speakText('${data.formula.replace(/'/g, "\\'")}')">🔊 聽整句</button><br><span style="font-size: 13px; color: #555; display: block; margin-top: 6px;">${data.formulaZh}</span></div>`;

        html += `<div class="section-title">📝 記憶小測驗（進階 2 分難度・共 5 題）</div>`;
        data.quizzes.forEach((quiz, index) => {
            html += `<div class="quiz-box"><div class="question">${quiz.q}</div><div class="options" id="${dayKey}_q${index}">`;
            quiz.opts.forEach((opt, optIdx) => {
                const optLetter = ['A', 'B', 'C'][optIdx];
                html += `<label><input type="radio" name="${dayKey}_q${index}" value="${optLetter}"> ${optLetter}. ${opt}</label>`;
            });
            html += `</div></div>`;
        });

        html += `<div class="task-box"><div style="font-weight: bold; color: #d35400;">🎯 句型造句挑戰</div><p style="font-size: 14px; margin: 5px 0 5px 0;">請嘗試寫出今日句型練習：</p><textarea id="userAnswer_${dayKey}" placeholder="${data.placeholder}"></textarea><button class="submit-btn" onclick="submitTask('${dayKey}')">✅ 檢查測驗並一鍵 Line 打卡</button><div id="resultMsg_${dayKey}"></div></div>`;

        document.getElementById('contentArea').innerHTML = html;
    }

    function switchDay(dayKey) {
        renderDay(dayKey);
    }

    renderDay('w2_2');

    function updateStreakAndReward() {
        const lastCheckDate = localStorage.getItem('ava_last_check_date');
        const storedStreak = parseInt(localStorage.getItem('ava_streak_count')) || 0;
        const today = new Date().toISOString().slice(0, 10);
        const yesterdayDate = new Date();
        yesterdayDate.setDate(yesterdayDate.getDate() - 1);
        const yesterday = yesterdayDate.toISOString().slice(0, 10);

        let currentStreak = 1;
        if (lastCheckDate === today || lastCheckDate === yesterday) {
            currentStreak = storedStreak > 0 ? storedStreak : 1;
        } else {
            currentStreak = 1;
        }

        document.getElementById('streakDisplay').innerText = `🔥 目前已連續打卡： ${currentStreak} 天！`;

        const targetDays = 5;
        let progressDays = currentStreak > targetDays ? targetDays : currentStreak;
        if (lastCheckDate !== today && lastCheckDate !== yesterday && lastCheckDate) {
            progressDays = 0;
        }

        const percentage = (progressDays / targetDays) * 100;
        document.getElementById('progressBar').style.width = percentage + '%';
        document.getElementById('progressText').innerText = `${progressDays} / ${targetDays} 天`;

        if (progressDays >= targetDays) {
            document.getElementById('rewardDesc').innerText = "🎊 太神啦！已成功解鎖心願禮物（衣服一件）！快去領取獎勵吧！";
            document.getElementById('rewardDesc').style.fontWeight = "bold";
        } else {
            document.getElementById('rewardDesc').innerText = `再打卡 ${targetDays - progressDays} 天即可解鎖實體禮物（衣服一件）！`;
        }
    }
    updateStreakAndReward();

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("您的裝置或瀏覽器不支援語音朗讀功能");
        }
    }

    function submitTask(dayKey) {
        const msg = document.getElementById(`resultMsg_${dayKey}`);
        const answerKeys = {
            w2_1: ['A', 'B', 'A', 'B', 'B'],
            w2_2: ['B', 'A', 'C', 'A', 'A'],
            w1_weekend: ['A', 'B', 'A', 'B', 'A']
        };

        let score = 0;
        let allAnswered = true;
        
        for (let i = 0; i < 5; i++) {
            const radios = document.getElementsByName(`${dayKey}_q${i}`);
            let answered = false;
            for (let r of radios) {
                if (r.checked) {
                    answered = true;
                    if (r.value === answerKeys[dayKey][i]) {
                        score += 20;
                    }
                }
            }
            if (!answered) allAnswered = false;
        }
        
        if (!allAnswered) {
            msg.style.color = '#c0392b';
            msg.innerText = "還有選擇題沒寫完喔！請把 5 題選擇題做完再打卡。";
            return;
        }
        
        const answerText = document.getElementById(`userAnswer_${dayKey}`).value.trim();
        if (answerText.length < 3) {
            msg.style.color = '#c0392b';
            msg.innerText = "請在下方寫出你的造句練習再送出喔！";
            return;
        }

        const today = new Date().toISOString().slice(0, 10);
        const lastCheckDate = localStorage.getItem('ava_last_check_date');
        const storedStreak = parseInt(localStorage.getItem('ava_streak_count')) || 1;
        const yesterdayDate = new Date();
        yesterdayDate.setDate(yesterdayDate.getDate() - 1);
        const yesterday = yesterdayDate.toISOString().slice(0, 10);

        let currentStreak = 1;
        if (lastCheckDate !== today) {
            if (lastCheckDate === yesterday) {
                currentStreak = storedStreak + 1;
            } else if (!lastCheckDate) {
                currentStreak = 1;
            } else {
                currentStreak = 1;
            }
            localStorage.setItem('ava_streak_count', currentStreak);
            localStorage.setItem('ava_last_check_date', today);
        } else {
            currentStreak = storedStreak;
        }

        updateStreakAndReward();
        
        const titleLabel = dayKey === 'w2_2' ? '第二週 Day 2 (進階)' : '第二週 Day 1';
        const lineMessage = `【Ava 英文打卡 ✈️ ${titleLabel}】\n🔥 連續打卡：第 ${currentStreak} 天\n🎯 選擇題得分：${score} 分\n✍️ 造句練習：\n${answerText}`;
        globalPendingLineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(lineMessage)}`;

        let rewardText = currentStreak >= 5 ? "<br>🎁 <b>恭喜解鎖實體心願：衣服一件！</b>" : `<br>距離解鎖衣服還差 ${5 - (currentStreak % 5 === 0 ? 5 : currentStreak % 5)} 天！`;
        document.getElementById('modalText').innerHTML = `測驗得分 <b>${score} 分</b><br>🔥 連續打卡 <b>${currentStreak} 天</b>！${rewardText}`;
        document.getElementById('successModal').style.display = 'flex';
    }

    function proceedToLine() {
        if (globalPendingLineUrl) {
            window.location.href = globalPendingLineUrl;
        }
    }
</script>

</body>
</html>
