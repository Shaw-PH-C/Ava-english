    let globalLineUrl = "";
    let finalScore = 0;
    let finalStreak = 1;

    function updateStreakAndReward() {
        const lastCheckDate = localStorage.getItem('ava_last_check_date');
        const storedStreak = parseInt(localStorage.getItem('ava_streak_count')) || 0;
        const today = new Date().toISOString().slice(0, 10);
        const yesterdayDate = new Date();
        yesterdayDate.setDate(yesterdayDate.getDate() - 1);
        const yesterday = yesterdayDate.toISOString().slice(0, 10);

        let currentStreak = 1;
        if (lastCheckDate === today || lastCheckDate === yesterday) {
            currentStreak = storedStreak > 0 ? storedStreak : 1;
        } else {
            currentStreak = 1;
        }
        finalStreak = currentStreak;

        document.getElementById('streakDisplay').innerText = `🔥 目前已連續打卡： ${currentStreak} 天！`;

        const targetDays = 5;
        let progressDays = currentStreak > targetDays ? targetDays : currentStreak;
        if (lastCheckDate !== today && lastCheckDate !== yesterday && lastCheckDate) {
            progressDays = 0;
        }

        const percentage = (progressDays / targetDays) * 100;
        document.getElementById('progressBar').style.width = percentage + '%';
        document.getElementById('progressText').innerText = `${progressDays} / ${targetDays} 天`;

        if (progressDays >= targetDays) {
            document.getElementById('rewardDesc').innerText = "🎊 太神啦！已成功解鎖心願禮物（衣服一件）！";
        } else {
            document.getElementById('rewardDesc').innerText = `再打卡 ${targetDays - progressDays} 天即可解鎖實體禮物（衣服一件）！`;
        }
    }
    updateStreakAndReward();

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("您的瀏覽器不支援語音朗讀");
        }
    }

    function renderDay(dayKey) {
        const data = daysData[dayKey];
        let html = `<div style="font-weight: bold; color: #2980b9; margin-bottom: 15px; font-size: 16px;">📌 ${data.title}</div>`;

        html += `<div class="section-title">📚 核心單字清單（點擊 🔊 聽發音）</div><ul>`;
        data.words.forEach(w => {
            html += `<li><b>${w.en}</b> (${w.zh}) <button class="audio-btn" onclick="speakText('${w.en}')">🔊 讀音</button></li>`;
        });
        html += `</ul>`;

        html += `<div class="section-title">🗣️ 黃金對話句型</div>`;
        html += `<div class="formula-box"><b>${data.formula}</b><button class="audio-btn" style="float: right;" onclick="speakText('${data.formula.replace(/'/g, "\\'")}')">🔊 聽整句</button><br><span style="font-size: 13px; color: #555; display: block; margin-top: 6px;">${data.formulaZh}</span></div>`;

        html += `<div class="section-title">📝 記憶小測驗（共 5 題）</div>`;
        data.quizzes.forEach((quiz, index) => {
            html += `<div class="quiz-box"><div class="question">${quiz.q}</div><div class="options" id="${dayKey}_q${index}">`;
            quiz.opts.forEach((opt, optIdx) => {
                const optLetter = ['A', 'B', 'C'][optIdx];
                html += `<label><input type="radio" name="${dayKey}_q${index}" value="${optLetter}"> ${optLetter}. ${opt}</label>`;
            });
            html += `</div></div><div id="fb_${dayKey}_q${index}" class="feedback-text"></div>`;
        });

        html += `<div class="task-box">
            <div style="font-weight: bold; color: #d35400;">🎯 練習造句挑戰</div>
            <div class="scenario-desc"><b>💡 練習場景：</b>${data.scenario}</div>
            <textarea id="userAnswer_${dayKey}" placeholder="${data.placeholder}"></textarea>
            <button class="action-btn" onclick="gradeAndPreview('${dayKey}')">🔍 檢查答案與預覽打卡內容</button>
            <div id="previewArea_${dayKey}" style="margin-top:15px; background:#f4f6f7; padding:12px; border-radius:6px; font-size:14px; display:none; border:1px solid #bdc3c7;"></div>
            <button class="line-btn" id="lineSendBtn_${dayKey}" onclick="sendToLine('${dayKey}')">🚀 確認無誤，一鍵 Line 打卡送出！</button>
        </div>`;

        document.getElementById('contentArea').innerHTML = html;
        document.getElementById('daySelector').value = dayKey;
    }

    function switchDay(dayVal) {
        renderDay(dayVal);
    }

    // 初始化渲染第三週 Day 4
    renderDay('w3_4');

    function gradeAndPreview(dayKey) {
        const data = daysData[dayKey];
        const correctAnswers = data.answers;
        let score = 0;
        let allAnswered = true;

        for (let i = 0; i < correctAnswers.length; i++) {
            const key = `${dayKey}_q${i}`;
            const radios = document.getElementsByName(key);
            let answered = false;
            let selectedVal = "";
            for (let r of radios) {
                if (r.checked) {
                    answered = true;
                    selectedVal = r.value;
                }
            }

            const fb = document.getElementById(`fb_${key}`);
            if (!answered) {
                allAnswered = false;
                fb.innerText = "❌ 請選擇答案";
                fb.className = "feedback-text incorrect";
            } else {
                if (selectedVal === correctAnswers[i]) {
                    score += 20;
                    fb.innerText = "✅ 答對了！";
                    fb.className = "feedback-text correct";
                } else {
                    fb.innerText = `❌ 答錯了 (正確答案是 ${correctAnswers[i]})`;
                    fb.className = "feedback-text incorrect";
                }
            }
        }

        if (!allAnswered) {
            alert("還有選擇題尚未作答完畢喔！");
            return;
        }

        const answerText = document.getElementById(`userAnswer_${dayKey}`).value.trim();
        if (answerText.length < 3) {
            alert("請在下方造句欄位寫下你的情境練習！");
            return;
        }

        finalScore = score;

        const previewArea = document.getElementById(`previewArea_${dayKey}`);
        previewArea.style.display = 'block';
        previewArea.innerHTML = `
            <b>🔍 智慧批改與打卡內容預覽：</b><br>
            • 單元：<b>${data.title}</b><br>
            • 選擇題得分：<b>${score} 分</b><br>
            • 連續打卡：<b>第 ${finalStreak} 天</b><br>
            • 你的練習內容：<br><span style="color: #2980b9; font-style: italic;">"${answerText}"</span><br>
            <hr style="border:0; border-top:1px solid #ccc; margin:8px 0;">
            ✨ 老師評語：限量預購與候補名單的表達非常道地流暢！點擊下方按鈕即可正式打卡。
        `;

        const lineMessage = `【Ava 英文打卡 🌟 ${data.title}】\n🔥 連續打卡：第 ${finalStreak} 天\n🎯 選擇題得分：${finalScore} 分\n✍️ 造句練習：\n${answerText}`;
        globalLineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(lineMessage)}`;

        document.getElementById(`lineSendBtn_${dayKey}`).style.display = 'block';
        previewArea.scrollIntoView({ behavior: 'smooth' });
    }

    function sendToLine(dayKey) {
        const today = new Date().toISOString().slice(0, 10);
        const lastCheckDate = localStorage.getItem('ava_last_check_date');
        const storedStreak = parseInt(localStorage.getItem('ava_streak_count')) || 1;
        const yesterdayDate = new Date();
        yesterdayDate.setDate(yesterdayDate.getDate() - 1);
        const yesterday = yesterdayDate.toISOString().slice(0, 10);

        let currentStreak = 1;
        if (lastCheckDate !== today) {
            if (lastCheckDate === yesterday) {
                currentStreak = storedStreak + 1;
            } else if (!lastCheckDate) {
                currentStreak = 1;
            } else {
                currentStreak = 1;
            }
            localStorage.setItem('ava_streak_count', currentStreak);
            localStorage.setItem('ava_last_check_date', today);
        } else {
            currentStreak = storedStreak;
        }

        updateStreakAndReward();

        let rewardText = currentStreak >= 5 ? "<br>🎁 <b>恭喜解鎖實體心願：衣服一件！</b>" : `<br>距離解鎖衣服還差 ${5 - (currentStreak % 5 === 0 ? 5 : currentStreak % 5)} 天！`;
        document.getElementById('modalText').innerHTML = `單元完成！得分 <b>${finalScore} 分</b><br>🔥 連續打卡 <b>${currentStreak} 天</b>！${rewardText}`;
        document.getElementById('successModal').style.display = 'flex';
    }

    function closeModalAndRedirect() {
        if (globalLineUrl) {
            window.location.href = globalLineUrl;
        }
    }
